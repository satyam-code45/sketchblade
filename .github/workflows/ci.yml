name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          # postinstall runs prisma generate, which only needs the URL to parse
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - run: pnpm --filter=@repo/db exec prisma validate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm test
